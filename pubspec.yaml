name: alsakr_family
description: الصقر - طالب وولي أمر
publish_to: "none"
version: 1.0.9+10

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  http_parser: ^4.1.2
  flutter_secure_storage: ^10.3.1
  provider: ^6.1.5
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  signalr_netcore: ^1.4.0
  intl: ^0.20.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_polyline_points: ^2.1.0
  qr_flutter: ^4.1.0
  pdf: ^3.11.1
  printing: ^5.13.4
  share_plus: ^13.3.0
  path_provider: ^2.1.5
  screenshot: ^3.0.0
  image_picker: ^1.2.3
  file_picker: ^13.1.0
  image: ^4.9.1
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1
  cached_network_image: ^3.4.1
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.1
  package_info_plus: ^10.2.1
  app_badge_plus: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/english_logo.jpg
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/english_logo.jpg
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/english_logo.jpg